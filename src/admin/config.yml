# ---------------------------------------------------------------------------
# BACKEND: supplied by DecapBridge, 6 Oct 2026. `name: git-gateway` is correct
# here - it points at DecapBridge's gateway (gateway_url), NOT the deprecated
# Netlify Identity one.
# ---------------------------------------------------------------------------
# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: JRixon-WORK/edit-test
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/13c57c26-2509-4e7f-bb0e-35f772907329/pkce
  auth_token_endpoint: /sites/13c57c26-2509-4e7f-bb0e-35f772907329/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://edit-test.jrixon2026.workers.dev

publish_mode: simple
media_folder: "src/images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - name: "home"
        label: "Home page"
        file: "src/index.md"
        fields:
          - { name: title, label: "Page title", widget: string }
          - { name: description, label: "Search description", widget: string }
          - { name: body, label: "Page content", widget: markdown }
          - { name: layout, label: "Layout", widget: hidden, default: "base.njk" }
      - name: "about"
        label: "About page"
        file: "src/about.md"
        fields:
          - { name: title, label: "Page title", widget: string }
          - { name: description, label: "Search description", widget: string }
          - { name: body, label: "Page content", widget: markdown }
          - { name: layout, label: "Layout", widget: hidden, default: "base.njk" }

  - name: "reflections"
    label: "Reflections"
    folder: "src/reflections"
    create: true
    slug: "{{slug}}"
    extension: "md"
    fields:
      - { name: title, label: "Title", widget: string }
      - { name: description, label: "Search description", widget: string }
      - { name: date, label: "Date", widget: datetime }
      - { name: body, label: "Reflection", widget: markdown }
      - { name: layout, label: "Layout", widget: hidden, default: "base.njk" }
      - { name: tags, label: "Tags", widget: hidden, default: "reflection" }
